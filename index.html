<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Home - ItzBrenden.com</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link href='https://cdn.boxicons.com/3.0.7/fonts/basic/boxicons.min.css' rel='stylesheet'>
  <link href='https://cdn.boxicons.com/3.0.7/fonts/brands/boxicons-brands.min.css' rel='stylesheet'>
  <link rel="icon" href="./assets/LauraReborn7_PFP.webp" type="image/x-icon">
  <script type="text/javascript" src="js/nav-active.js" defer></script>
</head>

<body>
  <div id="background"></div>
  <video id="background-video" autoplay muted loop playsinline>
    <source src="assets/backgrounds/background.webm" type="video/webm">
  </video>

  <header class="header">
    <a href="index.html" class="logo">
      <img src="assets/LauraReborn7_PFP.webp" alt="Laura Reborn" class="logo-icon">
      <p class="logo-text">ItzBrenden.com</p>
    </a>

    <input type="checkbox" id="check">
    <label for="check" class="icons">
      <i class='bx  bx-menu' id="menu-icon"></i>
      <i class='bx  bx-x' id="close-icon"></i>
    </label>

    <nav class="navbar">
      <a href="index.html" class = "" style="--i:1;">Home</a>
      <a href="about.html" style="--i:2;">About me</a>
      <a href="blog.html" style="--i:3;">Blog</a>
      <a href="portfolio.html" style="--i:4;">Art Portfolio</a>
      <a href="projects.html" style="--i:6;">Projects</a>
    </nav>
  </header>

  <main class="container-row">
    <a href="about.html" class="container-home glass">
      <img src="assets/about-me.png" alt="About me" class="container-image">
      <div class="container-caption"><span>About me</span></div>
    </a>

    <a href="portfolio.html" class="container-home glass">
      <img src="img/artPortfolio/OG5Remake - lower cromab.webp" alt="Art Portfolio" class="container-image">
      <div class="container-caption"><span>Art Portfolio</span></div>
    </a>

    <a href="projects.html" class="container-home glass">
      <img src="img/StoryBanners_Legends.webp" alt="Projects" class="container-image">
      <div class="container-caption"><span>Projects</span></div>
    </a>
  </main>

<div class="circular-buttons-container">
    <a href="https://x.com/ItzBrenden_" target="_blank" rel="noopener noreferrer" class="circular-button glass" aria-label="Twitter">
      <i class='bxl bx-twitter button-icon-placeholder' aria-hidden="true"></i>
    </a>
    
    <a href="https://bsky.app/profile/itzbrenden.art" target="_blank" rel="noopener noreferrer" class="circular-button glass" aria-label="Bluesky">
      <i class='bxl bx-bluesky button-icon-placeholder' aria-hidden="true"></i>
    </a>
    
    <a href="https://www.youtube.com/@ItzBrenden" target="_blank" rel="noopener noreferrer" class="circular-button glass" aria-label="YouTube">
      <i class='bxl bx-youtube button-icon-placeholder' aria-hidden="true"></i>
    </a>
</div>

  <script>
    const video = document.getElementById("background-video");

    video.addEventListener("canplay", () => {
      video.classList.add("loaded");
    });
  </script>
</body>

</html>
