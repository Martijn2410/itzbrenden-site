<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Art Portfolio - ItzBrenden.com</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/lists.css">
  <link rel="stylesheet" href="css/skeletonloading.css">
  <link rel="stylesheet" href="css/imagefocus.css">
  <link rel="stylesheet" href="css/portfolio.css">
  <link rel="icon" href="./assets/LauraReborn7_PFP.webp" type="image/x-icon">
  <link href='https://cdn.boxicons.com/3.0.7/fonts/basic/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&icon_names=thumb_up" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=download" />
  <script type="text/javascript" src="js/nav-active.js" defer></script>
  <script type="text/javascript" src="js/portfolio-navbar.js" defer></script>
  <script type="text/javascript" src="js/portfolio-fetcher.js" defer></script>
  <script type="text/javascript" src="js/imagefocus.js" defer></script>
  <script type="text/javascript" src="js/likes.js" defer></script>
</head>

<body class="portfolio-page">

  <div id="background"></div>
  <video id="background-video" autoplay muted loop playsinline>
    <source src="assets/backgrounds/background.webm" type="video/webm">
  </video>

  <header class="header">
    <a href="index.html" class="logo">
      <img src="assets/LauraReborn7_PFP.webp" alt="Laura Reborn" class="logo-icon">
      <p class="logo-text">Art Portfolio</p>
    </a>

    <input type="checkbox" id="check">
    <label for="check" class="icons">
      <i class='bx  bx-menu' id="menu-icon"></i>
      <i class='bx  bx-x' id="close-icon"></i>
    </label>

    <nav class="navbar">
      <a href="index.html" class = "" style="--i:1;">Home</a>
      <a href="about.html" style="--i:2;">About me</a>
      <a href="blog.html" style="--i:3;">Blog</a>
      <a href="portfolio.html" style="--i:4;">Art Portfolio</a>
      <a href="projects.html" style="--i:6;">Projects</a>
    </nav>
  </header>

  <!-- <div id="background"></div> -->
  <main>
    <div class="lightbox" id="lightbox">
      <span class="imageClose">&times;</span>
      <img class="lightbox-img" id="lightbox-img" src="" alt="Expanded Art" />
      <div class="lightbox-title" id="lightbox-title" aria-live="polite"></div>
    </div>
    <div class="list-art" id="portfolio-grid"></div>
  </main>
  <div class="circular-buttons-container portfolio-home-button-container">
    <a href="index.html" rel="noopener noreferrer" class="circular-button glass" aria-label="Back to Home">
      <i class='bx bx-home button-icon-placeholder' aria-hidden="true"></i>
    </a>
  </div>
  <script>
    const video = document.getElementById("background-video");

    if (video) {
      if (video.readyState >= 3) {
        video.classList.add("loaded");
      } else {
        video.addEventListener("canplay", () => {
          video.classList.add("loaded");
        });
      }
    }
  </script>
  <script>
    document.addEventListener("contextmenu", function (e) {
      if (e.target.tagName === "IMG") {
        e.preventDefault();
      }
    });
  </script>
  
</body>

</html>
